<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="2050" viewBox="0 0 1240 2050" role="img" aria-labelledby="title desc">
<title id="title">WebSocket 聊天室：连接、登录与消息广播</title><desc id="desc">蓝色：服务端连接处理   绿色：浏览器   紫色：Hub / 广播   黄色：分支判断；退出逻辑见另一张图。</desc>
