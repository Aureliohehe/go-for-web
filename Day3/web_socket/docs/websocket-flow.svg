<rect x="850.0" y="947.0" width="260" height="66" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="980" y="974.0" text-anchor="middle">writer 从 sc 取出消息</text><text x="980" y="998.0" text-anchor="middle">WriteMessage 发送至浏览器</text>
<rect x="120.0" y="947.0" width="260" height="66" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="250" y="974.0" text-anchor="middle">浏览器 ws.onmessage</text><text x="250" y="998.0" text-anchor="middle">解析收到的 JSON</text>
